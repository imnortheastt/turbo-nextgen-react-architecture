# __API_ORIGIN__ is replaced at image build time with the origin of VITE_API_URL.
# add_header in a location replaces inherited headers, so each location repeats them.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Vite emits content-hashed files here: cache them forever.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    try_files $uri =404;
  }

  # SPA fallback: deep links render index.html; never cache it.
  location / {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' __API_ORIGIN__ https://*.ingest.sentry.io https://*.ingest.us.sentry.io; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'none'" always;
    try_files $uri /index.html;
  }
}
